name: Build and deploy playground

on:
  push:
    branches: [main, feat/outbox-playground]
    paths:
      - outbox-to-stream/playground/**
      - .github/workflows/deploy-playground.yml
  pull_request:
    paths:
      - outbox-to-stream/playground/**
      - .github/workflows/deploy-playground.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playground-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: outbox-to-stream/playground
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: outbox-to-stream/playground/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run test:sites
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: outbox-to-stream/playground/dist/client

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
